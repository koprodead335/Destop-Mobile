<!DOCTYPE html>
<html lang="en"> <!-- корневой тэг, основной язык сайта eng -->
    <head>
        <meta charset="UTF=8"> <!-- кодировка сайта -->
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="widht=device-widht, initial-scale=1.0"> <!-- подстраивает сайт для телефонов -->

        <title>Dekstop & Mobile</title>
        <link rel="shortcut icon" href="images/favicon.svg" type="images/x-icon"> <!-- подключает маленькую иконку для сайта -->

        <header class="suka"> <!-- контейнер шапки, в ней я вложил padding из-за чего он растягивается на весь экран, выполняя роль синего макета -->

                    <img src="images/Caption.svg" alt="">
                </nav>
            </div>
        </header>
        <main> <!-- тэг указывающее уникальность и важность контента -->
          <img class="suka" src="images/Forms.svg">
          <p class="p___suka">Registration and filling forms with various fields</p>
          <img src="images/Group 1.png" class="mockup-image">
          </main>
          <p class="p___suka"><b>layouts / Adaptive design</b></p>
